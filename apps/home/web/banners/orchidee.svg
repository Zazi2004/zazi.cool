<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 533" width="1600" height="533">
  <title>Orchidée</title>
  <desc>Dégradé rose et violet doux avec une arche claire.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a044e"/><stop offset="0.55" stop-color="#7e22ce"/><stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae8ff"/><stop offset="1" stop-color="#c4b5fd"/>
