<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 533" width="1600" height="533">
  <title>Prisme</title>
  <desc>Bandes de lumière cyan et violette traversées par un losange.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/><stop offset="0.55" stop-color="#6d28d9"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1600" height="533" fill="url(#bg)"/>
  <g filter="url(#blur)">
  <ellipse cx="250" cy="266" rx="400" ry="360" fill="#67e8f9" opacity="0.75"/>
  <ellipse cx="1350" cy="266" rx="400" ry="360" fill="#c084fc" opacity="0.75"/>
  <ellipse cx="800" cy="60" rx="360" ry="90" fill="#fef9c3" opacity="0.75"/>
  </g>
  <g opacity="0.92" filter="url(#soft)">
    <rect x="664.2857142857142" y="130.28571428571428" width="271.42857142857144" height="271.42857142857144" rx="47.5" transform="rotate(45 800 266)" fill="url(#shape)"/>
  </g>
</svg>
