<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 533" width="1600" height="533">
  <title>Nébuleuse</title>
  <desc>Nuage violet et rose sur fond nocturne, avec un anneau lumineux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a1f"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1600" height="533" fill="url(#bg)"/>
  <g filter="url(#blur)">
  <ellipse cx="400" cy="200" rx="600" ry="280" fill="#7c3aed" opacity="0.75"/>
  <ellipse cx="1250" cy="330" rx="520" ry="230" fill="#e879f9" opacity="0.75"/>
  <ellipse cx="820" cy="470" rx="420" ry="120" fill="#38bdf8" opacity="0.75"/>
  </g>
  <g opacity="0.92" filter="url(#soft)">
    <circle cx="800" cy="266" r="150" fill="none" stroke="url(#shape)" stroke-width="50"/>
  </g>
</svg>
