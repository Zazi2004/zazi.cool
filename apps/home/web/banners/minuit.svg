<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 533" width="1600" height="533">
  <title>Minuit</title>
  <desc>Bleu nuit traversé d'une lueur cyan en forme de pilule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1600" height="533" fill="url(#bg)"/>
  <g filter="url(#blur)">
  <ellipse cx="260" cy="380" rx="540" ry="230" fill="#6366f1" opacity="0.75"/>
  <ellipse cx="1340" cy="160" rx="540" ry="230" fill="#06b6d4" opacity="0.75"/>
  <ellipse cx="800" cy="266" rx="440" ry="140" fill="#8b5cf6" opacity="0.75"/>
  </g>
  <g opacity="0.92" filter="url(#soft)">
    <rect x="590" y="161" width="420" height="210" rx="105" fill="url(#shape)"/>
  </g>
</svg>
