# Local development: the app and its PostgreSQL database.
# Usage: `make up` (everything in containers) or `make dev` (database only, Go on the host).
name: home

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: home
      POSTGRES_USER: home
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home -d home"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      args:
        VERSION: local
    env_file: .env
    environment:
      # Inside Compose the database is reached by its service name, not localhost.
      DATABASE_URL: postgres://home:${POSTGRES_PASSWORD}@db:5432/home?sslmode=disable
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
