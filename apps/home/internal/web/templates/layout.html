{{define "head"}}<!doctype html>
<html lang="fr" data-background="{{.Background}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{- if .NoIndex}}
<meta name="robots" content="noindex">
{{- end}}
{{- if .Description}}
<meta name="description" content="{{.Description}}">
{{- end}}
{{- if .URL}}
<link rel="canonical" href="{{.URL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="zazi.cool">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{.URL}}">
<meta property="og:image" content="{{.Image}}">
{{- if .ImageAlt}}
<meta property="og:image:alt" content="{{.ImageAlt}}">
{{- end}}
<meta name="twitter:card" content="summary_large_image">
{{- end}}
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{asset "geist.woff2"}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset "home.css"}}">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
{{end}}
