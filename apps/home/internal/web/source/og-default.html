<!doctype html>
<!-- Source of static/og-default.png: open at 1200 × 630 and take a screenshot
     (README.md, « Image de partage »). Uses the embedded font and shapes. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Variable"; font-weight: 100 900; src: url("../static/assets/geist.woff2") format("woff2-variations"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(120% 80% at 50% 0%, #1f1b2c 0%, #0c0c10 70%);
    color: #fafafa;
    font-family: "Geist Variable", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  h1 { margin: 0; font-size: 132px; font-weight: 700; letter-spacing: -0.045em; }
  p { margin: 18px 0 0; font-size: 36px; color: #a1a1aa; }
  ul { display: flex; gap: 28px; margin: 44px 0 0; padding: 0; list-style: none; }
  li { font-size: 26px; font-weight: 500; color: #a78bfa; padding: 10px 22px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.06); }
  img { position: absolute; }
</style>
</head>
<body>
  <img src="../static/favicon.svg" width="190" height="190" style="left:70px;top:60px">
  <img src="../static/assets/shape-liens.svg" width="150" height="150" style="right:90px;top:70px">
