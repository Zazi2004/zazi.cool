# Local development: the app and its PostgreSQL database.
# Usage: `make up` (everything in containers) or `make dev` (database only + hot reload).
name: linktree

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: linktree
      POSTGRES_USER: linktree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linktree -d linktree"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      args:
        VERSION: local
    env_file: .env
    environment:
      # Inside Compose the database is reached by its service name, not localhost.
      DATABASE_URL: postgres://linktree:${POSTGRES_PASSWORD}@db:5432/linktree?sslmode=disable
      # The container serves the built front, never the Vite dev server.
      VITE_DEV_URL: ""
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
