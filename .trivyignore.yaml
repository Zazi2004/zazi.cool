# Flux's own RBAC, generated by `flux install --export` (infra/flux/README.md). The
# controllers must manage Secrets and arbitrary resources to reconcile applications, so
# these findings are inherent to Flux. Scoped to the generated file: any other manifest
# still fails the scan.
misconfigurations:
  - id: KSV-0041
    paths:
      - infra/flux/clusters/prod/flux-system/gotk-components.yaml
    statement: kustomize-controller applies Secrets (SOPS-decrypted) by design.
  - id: KSV-0046
    paths:
      - infra/flux/clusters/prod/flux-system/gotk-components.yaml
    statement: Flux CRD controller, view and edit ClusterRoles cover every resource by design.
