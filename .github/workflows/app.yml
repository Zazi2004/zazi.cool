name: app

# Reusable workflow called by ci.yml, which decides from the changed paths which apps run.
# Every deployable app goes through the same steps and publishes
# ghcr.io/zazi2004/<app>:<sha7> on pushes to main.
on:
  workflow_call:
    inputs:
      app:
        description: App directory name under apps/
        type: string
        required: true
      node:
        description: Set up Node.js (the app has a front in web/)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/${{ inputs.app }}

jobs:
  check:
    name: ${{ inputs.app }} / check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/${{ inputs.app }}/go.mod
          cache-dependency-path: apps/${{ inputs.app }}/go.sum

      - if: inputs.node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ inputs.app }}/web/package-lock.json

      # Same targets as locally; `make test` starts the app's dependencies with Docker Compose.
      - run: make lint
      - run: make test

  image:
    name: ${{ inputs.app }} / image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/zazi2004/${{ inputs.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build once without pushing, fail on fixable HIGH/CRITICAL vulnerabilities,
      # then push (layers come from the cache).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/${{ inputs.app }}
          load: true
          build-args: VERSION=${{ steps.tag.outputs.sha }}
          tags: ${{ inputs.app }}:scan
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.app }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/${{ inputs.app }}
          push: true
          build-args: VERSION=${{ steps.tag.outputs.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/Zazi2004/zazi.cool
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

  bump:
    name: ${{ inputs.app }} / bump
    needs: image
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/bump.yml
    with:
      app: ${{ inputs.app }}
    secrets: inherit
