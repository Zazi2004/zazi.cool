name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: ci / changes
    runs-on: ubuntu-latest
    outputs:
      home: ${{ steps.filter.outputs.home }}
      linktree: ${{ steps.filter.outputs.linktree }}
      pastebin: ${{ steps.filter.outputs.pastebin }}
      undercover: ${{ steps.filter.outputs.undercover }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # An app runs when its files or the shared app.yml changed, and only once it has a
      # Dockerfile (home is still a spec, with nothing deployable).
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          for app in home linktree pastebin undercover; do
            if [ -f "apps/$app/Dockerfile" ] && echo "$changed" | grep -qE "^(apps/$app/|\.github/workflows/app\.yml)"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done

  secrets:
    name: ci / secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan:
    name: ci / scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Vulnerabilities in dependencies (go.mod, package-lock.json) and misconfigurations
      # (Dockerfiles, Kubernetes manifests).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          # Scoped exceptions for Flux's generated RBAC (see the file for the reasons).
          TRIVY_IGNOREFILE: .trivyignore.yaml

  # Tests of the shell scripts used by the workflows (.github/scripts).
  scripts:
    name: ci / scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: .github/scripts/flux-suspended_test.sh

  home:
    name: home
    needs: changes
    if: needs.changes.outputs.home == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/app.yml
    secrets: inherit
    with:
      app: home

  linktree:
    name: linktree
    needs: changes
    if: needs.changes.outputs.linktree == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/app.yml
    secrets: inherit
    with:
      app: linktree

  pastebin:
    name: pastebin
    needs: changes
    if: needs.changes.outputs.pastebin == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/app.yml
    secrets: inherit
    with:
      app: pastebin

  undercover:
    name: undercover
    needs: changes
    if: needs.changes.outputs.undercover == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/app.yml
    secrets: inherit
    with:
      app: undercover
      node: true

  # The only status check required by the `main` ruleset. App workflows only run when
  # their paths changed, so this job is always executed and fails if any job failed or
  # was cancelled; `skipped` (unchanged app) is fine.
  required:
    name: ci / required
    if: always()
    needs: [changes, secrets, scan, scripts, home, linktree, pastebin, undercover]
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
