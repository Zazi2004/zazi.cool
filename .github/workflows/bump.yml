name: bump

# Called by the app workflows once the image is pushed: opens (or updates) the PR that sets
# `newTag` in infra/apps/<app>/overlays/prod/kustomization.yaml, then enables auto-merge on it:
# GitHub merges it once the required checks are green. Auto-merge is only enabled when the PR
# touches nothing but that file (guard below). Needs BUMP_TOKEN, see infra/README.md.
on:
  workflow_call:
    inputs:
      app:
        description: Application name (folder under infra/apps)
        required: true
        type: string
    secrets:
      BUMP_TOKEN:
        description: >-
          PAT or GitHub App token. Pushes and merges made with GITHUB_TOKEN do not trigger
          workflows, so the PR would have no checks and deploy-verify would not run after
          the merge. Without it, the PR is opened but auto-merge is not enabled.
        required: false

permissions:
  contents: read

jobs:
  bump:
    name: ${{ inputs.app }} / bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    # At most one bump per app at a time; a newer run replaces a pending older one.
    concurrency:
      group: bump-${{ inputs.app }}
      cancel-in-progress: false
    env:
      APP: ${{ inputs.app }}
      GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Open or update the bump PR
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          file="infra/apps/$APP/overlays/prod/kustomization.yaml"
          branch="chore/infra-deploy-$APP"
          title="chore(infra): deploy $APP $sha"

          if [ -n "$(gh issue list --label "deploy-blocked:$APP" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "::warning::bumps of $APP are paused (open deploy-blocked:$APP issue), skipping"
            exit 0
          fi

          current="$(sed -n 's/^ *newTag: *//p' "$file")"
          if [ "$current" = "$sha" ]; then
            echo "newTag is already $sha, nothing to do"
            exit 0
          fi

          sed -i "s/^\( *newTag:\).*/\1 $sha/" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add "$file"
          git commit -m "$title"
          # The branch only holds the bump commit, so a force push is how a newer merge
          # replaces the previous bump.
          git push --force origin "$branch"

          body="Automatic bump of \`newTag\` to \`$sha\` (image \`ghcr.io/zazi2004/$APP:$sha\`), opened by the CI after the push to \`main\`. It is merged automatically once its checks are green (see infra/README.md)."
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            pr="$existing"
          else
            pr="$(gh pr create --head "$branch" --base main --title "$title" --body "$body" | grep -oE '[0-9]+$')"
          fi
          echo "PR=$pr" >> "$GITHUB_ENV"

      # Guard: only a bump of a prod kustomization may be merged without a human.
      - name: Enable auto-merge
        env:
          HAS_BUMP_TOKEN: ${{ secrets.BUMP_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            echo "No PR was opened, nothing to merge"
            exit 0
          fi
          if [ "$HAS_BUMP_TOKEN" != "true" ]; then
            echo "::warning::BUMP_TOKEN is not set: auto-merge not enabled, the PR needs a manual merge"
            exit 0
          fi
          allowed="infra/apps/$APP/overlays/prod/kustomization.yaml"
          files="$(gh pr diff "$PR" --name-only)"
          if [ "$files" != "$allowed" ]; then
            gh pr merge "$PR" --disable-auto || true
            echo "::error::PR #$PR must only touch $allowed, found:"
            echo "$files"
            exit 1
          fi
          # Only the newTag line may change: one line added, one removed.
          if [ "$(gh pr diff "$PR" | grep -cE '^[+-][^+-]')" != "2" ] || ! gh pr diff "$PR" | grep -qE '^\+ *newTag: *[0-9a-f]{7}$'; then
            gh pr merge "$PR" --disable-auto || true
            echo "::error::PR #$PR changes more than the newTag line"
            exit 1
          fi
          gh pr merge "$PR" --auto --squash
