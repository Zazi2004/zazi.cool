name: deploy-verify

# Runs `verify` after a bump PR is merged: a push to main that changes `newTag` in
# infra/apps/<app>/overlays/prod/kustomization.yaml. The app, the SHA and the URL come from
# the diff and the app's Ingress. Each deployment is recorded in the `production`
# environment (GitHub Deployments). When `verify` fails, the `rollback` job opens a PR that
# puts the previous tag back and blocks further bumps of that app until the issue it opens
# is closed. See infra/README.md, "Vérifier un déploiement" and "Rollback automatique".
on:
  push:
    branches: [main]
    paths:
      - infra/apps/*/overlays/prod/kustomization.yaml

permissions: {}

jobs:
  detect:
    name: deploy-verify / detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      deployments: ${{ steps.detect.outputs.deployments }}
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # One entry per app whose newTag changed (a bump or a revert of a bump), with the
      # GitHub deployment created for it.
      - id: detect
        run: |
          set -euo pipefail
          if [[ "$BEFORE" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; else base="$BEFORE"; fi
          entries='[]'
          # A push whose subject starts with this prefix is a rollback: never roll it back.
          if [[ "$(git log -1 --format=%s)" == "revert(infra): roll back "* ]]; then is_rollback=true; else is_rollback=false; fi
          for file in $(git diff --name-only "$base" HEAD -- 'infra/apps/*/overlays/prod/kustomization.yaml'); do
            app="$(echo "$file" | cut -d/ -f3)"
            old="$(git show "$base:$file" 2>/dev/null | sed -n 's/^ *newTag: *//p' | head -n1 || true)"
            new="$(sed -n 's/^ *newTag: *//p' "$file" | head -n1)"
            if [ -z "$new" ] || [ "$old" = "$new" ]; then
              echo "$app: newTag unchanged, skipping"
              continue
            fi
            host="$(sed -n 's/^ *- host: *//p' "infra/apps/$app/base/ingress.yaml" | head -n1)"
            if [ -z "$host" ]; then
              echo "::error::no host found in infra/apps/$app/base/ingress.yaml"
              exit 1
            fi
            id="$(jq -n --arg ref "$GITHUB_SHA" --arg desc "Deploy $app $new" \
              '{ref: $ref, environment: "production", description: $desc, auto_merge: false, required_contexts: [], production_environment: true}' \
              | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
            gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
              -f state=in_progress -f description="Waiting for $app $new" \
              -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
            entries="$(jq -c --arg app "$app" --arg url "https://$host" --arg sha "$new" --arg id "$id" \
              --arg old "$old" --argjson rb "$is_rollback" \
              '. + [{app: $app, url: $url, sha: $sha, deployment: $id, previous: $old, is_rollback: $rb}]' <<<"$entries")"
          done
          echo "deployments=$entries" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.app }} / verify
    needs: detect
    if: needs.detect.outputs.deployments != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.deployments) }}
    uses: ./.github/workflows/verify.yml
    with:
      app: ${{ matrix.app }}
      url: ${{ matrix.url }}
      sha: ${{ matrix.sha }}

  record:
    name: ${{ matrix.app }} / record
    needs: [detect, verify]
    if: always() && needs.detect.outputs.deployments != '[]'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.deployments) }}
    env:
      GH_TOKEN: ${{ github.token }}
      APP: ${{ matrix.app }}
      SHA: ${{ matrix.sha }}
      DEPLOYMENT: ${{ matrix.deployment }}
      URL: ${{ matrix.url }}
      RESULT: ${{ needs.verify.result }}
    steps:
      - name: Set the deployment status
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) state=success ;;
            cancelled) state=inactive ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT/statuses" \
            -f state="$state" -f description="verify $RESULT for $APP $SHA" \
            -f environment_url="$URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

  # One automatic rollback per bump. The rollback PR is itself verified by this workflow when
  # it is merged; if that verification fails too, nothing more is attempted (`is_rollback`).
  rollback:
    name: ${{ matrix.app }} / rollback
    needs: [detect, verify]
    if: always() && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.deployments) }}
    concurrency:
      group: rollback-${{ matrix.app }}
      cancel-in-progress: false
    env:
      # Pushes and PRs made with GITHUB_TOKEN do not trigger workflows: without BUMP_TOKEN the
      # rollback PR gets no `ci / required` check and cannot be merged.
      GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
      APP: ${{ matrix.app }}
      SHA: ${{ matrix.sha }}
      PREVIOUS: ${{ matrix.previous }}
      IS_ROLLBACK: ${{ matrix.is_rollback }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Roll back to the previous tag
        run: |
          set -euo pipefail
          label="deploy-blocked:$APP"
          if [ "$IS_ROLLBACK" = true ]; then
            echo "::error::$APP: verify failed on a rollback, manual action needed ($RUN_URL)"
            gh issue list --label "$label" --state open --json number --jq '.[].number' |
              while read -r n; do gh issue comment "$n" --body "Verify also failed after the rollback: $RUN_URL"; done
            exit 1
          fi
          if [[ ! "$PREVIOUS" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::$APP: no previous tag to roll back to (got '$PREVIOUS')"
            exit 1
          fi

          file="infra/apps/$APP/overlays/prod/kustomization.yaml"
          current="$(sed -n 's/^ *newTag: *//p' "$file" | head -n1)"
          if [ "$current" != "$SHA" ]; then
            echo "main now has newTag $current, not $SHA: a later change superseded this bump"
            exit 0
          fi

          # Block further bumps first, so a bump cannot slip in while the PR is being opened.
          gh label create "$label" --color B60205 --description "Bumps of $APP are paused until this issue is closed" --force
          gh issue create --label "$label" \
            --title "Deploy blocked: $APP $SHA failed verify" \
            --body "verify failed for \`$APP\` $SHA ($RUN_URL). The CI opened a rollback PR to \`$PREVIOUS\`. New bumps of $APP are paused: fix the problem, then close this issue to resume them."

          branch="revert/infra-deploy-$APP-$SHA"
          title="revert(infra): roll back $APP to $PREVIOUS ($SHA failed verify)"
          sed -i "s/^\( *newTag:\).*/\1 $PREVIOUS/" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add "$file"
          git commit -m "$title"
          git push origin "$branch"
          url="$(gh pr create --head "$branch" --base main --title "$title" \
            --body "Automatic rollback: verify failed for \`$APP\` $SHA ($RUN_URL). Puts \`newTag\` back to \`$PREVIOUS\`; Flux reapplies it and \`deploy-verify\` checks it after the merge.")"
          gh pr merge "$url" --auto --squash || echo "::warning::auto-merge unavailable, merge $url by hand"
