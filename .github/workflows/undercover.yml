name: undercover

on:
  push:
    branches: [main]
    paths:
      - "apps/undercover/**"
      - ".github/workflows/undercover.yml"
  pull_request:
    paths:
      - "apps/undercover/**"
      - ".github/workflows/undercover.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/undercover

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/undercover/go.mod
          cache-dependency-path: apps/undercover/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/undercover/web/package-lock.json

      # Same targets as locally; `make test` starts PostgreSQL with Docker Compose.
      - run: make lint
      - run: make test

  image:
    name: Build and push image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: apps/undercover
          push: true
          tags: ghcr.io/zazi2004/undercover:${{ steps.tag.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/Zazi2004/zazi.cool
          cache-from: type=gha,scope=undercover
          cache-to: type=gha,mode=max,scope=undercover
