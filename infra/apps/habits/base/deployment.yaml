apiVersion: apps/v1
kind: Deployment
metadata:
  name: habits
  namespace: habits
spec:
  # The server is stateless, but its login rate limiting is in memory: one replica (spec NF6).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: habits
  template:
    metadata:
      labels:
        app: habits
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # nonroot user of the distroless image
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: habits
          # The tag is set by the overlay (git SHA built by the CI).
          image: ghcr.io/zazi2004/habits
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BASE_URL
              value: https://habits.zazi.cool
            - name: TZ_NAME
              value: Europe/Paris
          envFrom:
            # DATABASE_URL and ADMIN_PASSWORD_HASH (overlays/prod/secret.enc.yaml).
            - secretRef:
                name: habits-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Spec NF6: to adjust after measurement.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
