# Template of the Secret read by the Deployment (envFrom). secret.enc.yaml holds encrypted
# placeholders: replace them with `sops edit infra/apps/habits/overlays/prod/secret.enc.yaml`,
# using the password chosen for the "habits" key of infra/data/secrets/app-db-passwords.enc.yaml
# and the hash printed by `make hash-password` (in apps/habits).
# Never commit the filled-in file unencrypted.
apiVersion: v1
kind: Secret
metadata:
  name: habits-env
  namespace: habits
type: Opaque
stringData:
  DATABASE_URL: postgres://habits:<password>@postgres.data.svc.cluster.local:5432/habits?sslmode=disable
  # Single quotes: the hash contains "$" characters.
  ADMIN_PASSWORD_HASH: '<bcrypt hash>'
