apiVersion: v1
kind: Namespace
metadata:
  name: home
  annotations:
    # Flux must never delete the namespace (and the Secret in it) on prune.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Allowed to reach PostgreSQL (infra/data/networkpolicy.yaml).
    zazi.cool/database: "true"
