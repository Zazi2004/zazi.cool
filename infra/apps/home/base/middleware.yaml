# HTTP → HTTPS. Requests already in HTTPS pass through unchanged. cert-manager's
# challenge Ingress has a more specific rule, so Traefik routes it first and Let's Encrypt
# can validate over HTTP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: home
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# www.zazi.cool → zazi.cool (301), path and query kept. Placed after redirect-https, so
# http://www.zazi.cool/x is first sent to https://www.zazi.cool/x, then to the apex.
# Requests to the apex do not match and pass through unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-www
  namespace: home
spec:
  redirectRegex:
    regex: ^https?://www\.zazi\.cool/(.*)
    replacement: https://zazi.cool/${1}
    permanent: true
---
# HSTS: browsers will only use HTTPS for the site and its subdomains for a year.
# The app sets the other security headers (CSP, nosniff…) itself.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: home
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
