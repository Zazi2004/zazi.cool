apiVersion: apps/v1
kind: Deployment
metadata:
  name: home
  namespace: home
spec:
  # The server is stateless, but its login rate limiting is in memory: one replica (spec NF8).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: home
  template:
    metadata:
      labels:
        app: home
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # nonroot user of the distroless image
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: home
          # The tag is set by the overlay (git SHA built by the CI).
          image: ghcr.io/zazi2004/home
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: https://zazi.cool
            # Behind Traefik, which appends the client IP to X-Forwarded-For
            # (externalTrafficPolicy: Local keeps the real one).
            - name: TRUST_PROXY
              value: "true"
          envFrom:
            # DATABASE_URL and ADMIN_PASSWORD_HASH (overlays/prod/secret.enc.yaml).
            - secretRef:
                name: home-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Spec NF8: the limits leave room for decoding an uploaded 4000 px banner.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
