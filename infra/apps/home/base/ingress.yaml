# zazi.cool must stay the first host: deploy-verify checks the first host it finds, and
# www.zazi.cool only answers 301.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  namespace: home
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<name>@kubernetescrd refers to the Traefik Middlewares of middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: home-redirect-https@kubernetescrd,home-redirect-www@kubernetescrd,home-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - zazi.cool
        - www.zazi.cool
      secretName: home-tls
  rules:
    - host: zazi.cool
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home
                port:
                  name: http
    - host: www.zazi.cool
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home
                port:
                  name: http
