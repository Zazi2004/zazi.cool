# Template of the Secret read by the Deployment (envFrom). secret.enc.yaml holds encrypted
# placeholders: replace them with `sops edit infra/apps/home/overlays/prod/secret.enc.yaml`,
# using the password chosen for the "home" key of infra/data/secrets/app-db-passwords.enc.yaml
# and the hash printed by `make hash-password` (in apps/home).
# Never commit the filled-in file unencrypted.
apiVersion: v1
kind: Secret
metadata:
  name: home-env
  namespace: home
type: Opaque
stringData:
  DATABASE_URL: postgres://home:<password>@postgres.data.svc.cluster.local:5432/home?sslmode=disable
  # Single quotes: the hash contains "$" characters.
  ADMIN_PASSWORD_HASH: '<bcrypt hash>'
