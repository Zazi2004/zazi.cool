# Production. To deploy a new version: set newTag to the 7-character git SHA built by
# the CI (ghcr.io/zazi2004/undercover:<sha>), commit, then `kubectl apply -k` this folder.
# The Secret (secret.enc.yaml) is applied separately with SOPS (see infra/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/zazi2004/undercover
    newTag: set-by-first-deploy
