apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: undercover
  namespace: undercover
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<name>@kubernetescrd refers to the Traefik Middlewares of middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: undercover-redirect-https@kubernetescrd,undercover-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - undercover.zazi.cool
      secretName: undercover-tls
  rules:
    - host: undercover.zazi.cool
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: undercover
                port:
                  name: http
