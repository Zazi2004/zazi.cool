# Template of the Secret read by the Deployment (envFrom). Copy it to secret.enc.yaml,
# fill in the password chosen for the "linktree" key of infra/data/secrets/app-db-passwords.enc.yaml
# and the hash printed by `make hash-password` (in apps/linktree), then encrypt it in place:
#   sops encrypt --in-place infra/apps/linktree/overlays/prod/secret.enc.yaml
# Never commit the filled-in file unencrypted.
apiVersion: v1
kind: Secret
metadata:
  name: linktree-env
  namespace: linktree
type: Opaque
stringData:
  DATABASE_URL: postgres://linktree:<password>@postgres.data.svc.cluster.local:5432/linktree?sslmode=disable
  # Single quotes: the hash contains "$" characters.
  ADMIN_PASSWORD_HASH: '<bcrypt hash>'
