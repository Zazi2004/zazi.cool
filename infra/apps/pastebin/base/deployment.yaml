apiVersion: apps/v1
kind: Deployment
metadata:
  name: pastebin
  namespace: pastebin
spec:
  # The server is stateless, but its rate limiting is in memory: one replica.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pastebin
  template:
    metadata:
      labels:
        app: pastebin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # nonroot user of the distroless image
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pastebin
          # The tag is set by the overlay (git SHA built by the CI).
          image: ghcr.io/zazi2004/pastebin
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BASE_URL
              value: https://pb.zazi.cool
          envFrom:
            # DATABASE_URL (overlays/prod/secret.enc.yaml).
            - secretRef:
                name: pastebin-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Spec NF3; to adjust after measuring.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
