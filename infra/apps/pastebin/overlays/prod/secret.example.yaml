# Template of the Secret read by the Deployment (envFrom). Copy it to secret.enc.yaml,
# fill in the password chosen for the "pastebin" key of infra/data/secrets/app-db-passwords.enc.yaml,
# then encrypt it in place:
#   sops encrypt --in-place infra/apps/pastebin/overlays/prod/secret.enc.yaml
# Never commit the filled-in file unencrypted.
apiVersion: v1
kind: Secret
metadata:
  name: pastebin-env
  namespace: pastebin
type: Opaque
stringData:
  DATABASE_URL: postgres://pastebin:<password>@postgres.data.svc.cluster.local:5432/pastebin?sslmode=disable
