# Suspended until the first deployment (docs/specs/habits.md, T7): the overlay has no image
# tag and secret.enc.yaml only holds placeholders. T7 sets both and removes `suspend`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: habits
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/apps/habits/overlays/prod
  decryption:
    provider: sops
    secretRef:
      name: sops-age
