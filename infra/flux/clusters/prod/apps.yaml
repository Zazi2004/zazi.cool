# One Flux Kustomization per application, limited to its production overlay.
# infra/cluster and infra/data are deliberately NOT reconciled by Flux.
# Add an application by copying this block (see infra/flux/README.md, "Migrer une app").
#
# `wait: true` makes Flux wait for every applied resource (Deployment rollout included)
# before reporting Ready, up to `timeout`; `healthChecks` would be ignored alongside it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pastebin
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/apps/pastebin/overlays/prod
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
