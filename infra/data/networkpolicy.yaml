# PostgreSQL only accepts connections from pods of this namespace (jobs, backups) and
# from namespaces labelled zazi.cool/database=true (apps that have a database).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              zazi.cool/database: "true"
      ports:
        - port: 5432
