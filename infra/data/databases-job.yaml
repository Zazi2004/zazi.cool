# Runs create-databases.sh. A finished Job is deleted after 10 minutes, so that
# `kubectl apply -k infra/data` can run it again later (new app, new password).
apiVersion: batch/v1
kind: Job
metadata:
  name: create-databases
  namespace: data
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:18.6-alpine
          command: ["sh", "/scripts/create-databases.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: UNDERCOVER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-passwords
                  key: undercover
            - name: PASTEBIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-passwords
                  key: pastebin
            - name: LINKTREE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-passwords
                  key: linktree
            # Not HOME_*: HOME is the shell's home directory.
            - name: HOME_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-passwords
                  key: home
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: create-databases
