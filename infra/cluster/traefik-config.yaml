# Customizes the Traefik bundled with k3s (applied with kubectl, merged by k3s' Helm
# controller into its own chart values).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        # Keep the client's real IP (needed for per-IP rate limiting) instead of the
        # node's IP after NAT.
        externalTrafficPolicy: Local
    # No global HTTP → HTTPS redirect here: it would also redirect cert-manager's HTTP-01
    # challenge away from its solver. Each Ingress uses a redirect-https Middleware instead
    # (see infra/apps/undercover/base/middleware.yaml).
