# Helm values for cert-manager (chart jetstack/cert-manager, version pinned in infra/README.md).
crds:
  enabled: true
# Small footprint: the VPS is shared by every app.
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 128Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
cainjector:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 128Mi }
